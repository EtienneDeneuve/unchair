# Daily check: vendored Sparkle vs upstream latest.
# Dependabot cannot track Vendor/Sparkle.framework — this workflow opens (or
# refreshes) a single tracking issue when an update is available.
name: Deps — Sparkle

on:
  schedule:
    # 06:15 Europe/Brussels ≈ 05:15 UTC (winter) / 04:15 UTC (summer).
    # Fixed UTC cron; "daily" intent matters more than exact local hour.
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deps-sparkle
  cancel-in-progress: true

jobs:
  check:
    name: Compare Vendor/Sparkle to upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read pinned Sparkle version
        id: pinned
        run: |
          set -euo pipefail
          PINNED="$(tr -d '[:space:]' < Vendor/SPARKLE_VERSION)"
          echo "version=${PINNED}" >>"$GITHUB_OUTPUT"
          echo "Pinned Sparkle: ${PINNED}"

      - name: Fetch upstream latest
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api repos/sparkle-project/Sparkle/releases/latest --jq .tag_name)"
          # Tags are typically "2.8.1" or "v2.8.1"
          LATEST="${TAG#v}"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
          echo "version=${LATEST}" >>"$GITHUB_OUTPUT"
          echo "Upstream Sparkle: ${TAG}"

      - name: Open or update tracking issue
        if: steps.pinned.outputs.version != steps.upstream.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.pinned.outputs.version }}
          LATEST: ${{ steps.upstream.outputs.version }}
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail
          TITLE="deps: Sparkle ${PINNED} → ${LATEST} available"
          BODY="$(cat <<EOF
          ## Sparkle update available

          | | |
          |---|---|
          | Vendored (\`Vendor/SPARKLE_VERSION\`) | \`${PINNED}\` |
          | Upstream latest | [\`${TAG}\`](https://github.com/sparkle-project/Sparkle/releases/tag/${TAG}) |

          Unchair vendors \`Vendor/Sparkle.framework\` (see \`project.yml\`). Dependabot cannot bump it.

          ### Update checklist
          1. Download the Sparkle release tarball and replace \`Vendor/Sparkle.framework\`
          2. Update \`Vendor/SPARKLE_VERSION\` to \`${LATEST}\`
          3. Re-run a local Direct release smoke (\`scripts/release.sh\` signs nested Sparkle helpers)
          4. Close this issue

          Automation: \`.github/workflows/deps-sparkle.yml\` (daily).
          EOF
          )"
          EXISTING="$(gh issue list --state open --search "Sparkle in:title deps" --json number,title --jq '[.[] | select(.title|test("Sparkle"))][0].number // empty')"
          if [[ -n "${EXISTING}" ]]; then
            gh issue comment "${EXISTING}" --body "Still open. Pinned \`${PINNED}\`, upstream \`${LATEST}\` ($(date -u +%Y-%m-%d))."
            gh issue edit "${EXISTING}" --title "${TITLE}" || true
            echo "Updated issue #${EXISTING}"
          else
            # Label may not exist yet on a fresh repo — create without labels if needed.
            if gh label list --json name --jq '.[].name' | grep -qx dependencies; then
              gh issue create --title "${TITLE}" --label "dependencies" --body "${BODY}"
            else
              gh label create dependencies --description "Dependency updates" --color "0366d6" 2>/dev/null || true
              gh issue create --title "${TITLE}" --label "dependencies" --body "${BODY}" \
                || gh issue create --title "${TITLE}" --body "${BODY}"
            fi
          fi

      - name: Up to date
        if: steps.pinned.outputs.version == steps.upstream.outputs.version
        run: echo "Sparkle ${{ steps.pinned.outputs.version }} matches upstream — nothing to do."
