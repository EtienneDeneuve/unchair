name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release scripts
        run: |
          bash -n scripts/release.sh scripts/release-mas.sh scripts/bump-homebrew-cask.sh scripts/publish-homebrew-cask.sh
          version="$(sed -n 's/^  version "\([^"]*\)"/\1/p' Casks/unchair.rb | head -1)"
          sha="$(sed -n 's/^  sha256 "\([^"]*\)"/\1/p' Casks/unchair.rb | head -1)"
          DMG_SHA256="$sha" ./scripts/bump-homebrew-cask.sh "$version"
          git diff --exit-code -- Casks/unchair.rb

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: |
          set -euo pipefail
          # Ad-hoc sign only — never inject release/Developer ID secrets into PR CI.
          xcodebuild test \
            -scheme Unchair \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/UnchairDerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual

      - name: Unsigned AppStore gate (Unchair-MAS)
        run: |
          set -euo pipefail
          # Compile/sandbox product gate only — no Apple Distribution secrets on PR CI (#139).
          xcodebuild build \
            -scheme Unchair-MAS \
            -configuration AppStore \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/UnchairMAS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO
          APP="$RUNNER_TEMP/UnchairMAS/Build/Products/AppStore/Unchair.app"
          test -d "$APP"
          if [[ -d "$APP/Contents/Frameworks/Sparkle.framework" ]]; then
            echo "error: Sparkle.framework must not ship in MAS product" >&2
            exit 1
          fi
