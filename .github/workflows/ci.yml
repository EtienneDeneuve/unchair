name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Test
        run: |
          set -euo pipefail
          # Ad-hoc sign only — never inject release/Developer ID secrets into PR CI.
          xcodebuild test \
            -scheme Unchair \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/UnchairDerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual
