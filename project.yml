name: Unchair
options:
  bundleIdPrefix: com.etiennedeneuve
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
configs:
  Debug: debug
  Release: release
  AppStore: release
packages:
  # Pinned via Package.resolved (committed). Dependabot ecosystem `swift` opens bump PRs.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.8.0"

targetTemplates:
  UnchairAppCommon:
    type: application
    platform: macOS
    sources:
      - path: Unchair
        excludes:
          - Info.plist
          - Info-AppStore.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.etiennedeneuve.unchair
        PRODUCT_NAME: Unchair
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "12"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Unchair
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Unchair uses the camera only during a movement break to verify that you stood up and moved. Frames are processed in memory on this Mac and are never saved or uploaded."
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Etienne Deneuve"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    postCompileScripts:
      - name: Prefer full AppIcon.icns
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          SRC="${SRCROOT}/Unchair/Resources/AppIcon.icns"
          DEST="${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/AppIcon.icns"
          if [[ -f "$SRC" && -d "$(dirname "$DEST")" ]]; then
            cp -f "$SRC" "$DEST"
            echo "Installed Finder AppIcon.icns ($(stat -f%z "$DEST") bytes)"
          fi

targets:
  Unchair:
    templates:
      - UnchairAppCommon
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        # Merged with generated keys — carries Sparkle SU* for Direct builds.
        INFOPLIST_FILE: Unchair/Info.plist
        CODE_SIGN_ENTITLEMENTS: Unchair/Unchair.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG DIRECT"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIRECT"
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"
          CODE_SIGN_ENTITLEMENTS: Unchair/Unchair-MAS.entitlements
          INFOPLIST_FILE: Unchair/Info-AppStore.plist
    scheme:
      testTargets:
        - UnchairTests

  # MAS product — same sources, NO Sparkle package link/embed (#139).
  UnchairAppStore:
    templates:
      - UnchairAppCommon
    dependencies: []
    settings:
      base:
        INFOPLIST_FILE: Unchair/Info-AppStore.plist
        CODE_SIGN_ENTITLEMENTS: Unchair/Unchair-MAS.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG APPSTORE"
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APPSTORE"

  UnchairTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UnchairTests
    dependencies:
      - target: Unchair
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.etiennedeneuve.unchair.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Unchair.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Unchair"
        BUNDLE_LOADER: "$(TEST_HOST)"

  UnchairCLI:
    type: tool
    platform: macOS
    sources:
      - path: UnchairCLI
      - path: Unchair/Integration/Control/ControlWire.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.etiennedeneuve.unchair.cli
        PRODUCT_NAME: unchair
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"

schemes:
  Unchair:
    build:
      targets:
        Unchair: all
        UnchairTests: [test]
        UnchairCLI: all
    test:
      config: Debug
      targets:
        - UnchairTests
    archive:
      config: Release
  Unchair-MAS:
    build:
      targets:
        UnchairAppStore: all
    archive:
      config: AppStore
  UnchairCLI:
    shared: true
    build:
      targets:
        UnchairCLI: all
    run:
      config: Debug
